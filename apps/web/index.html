<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NepalVerse</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="NepalVerse — a clean data viewer for scraped Nepal travel data"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      (function () {
        var stored = null;
        try {
          stored = window.localStorage.getItem('nepalverse:theme');
        } catch (error) {
          stored = null;
        }
        var prefersDark =
          typeof window.matchMedia === 'function' &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark =
          stored === 'dark' ||
          ((stored === null || stored === 'system') && prefersDark);
        if (dark) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
